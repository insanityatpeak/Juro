[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juro"
version = "0.2.0"
authors = [
  { name="Priyanshu" },
]
description = "Juro — an adversarial AI tribunal for denied health-insurance claims, built on Band (thenvoi)."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Local debate generator (Anthropic-only path) — light Haiku models.
    "anthropic>=0.40.0",

    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Band submission path — the Band SDK (formerly "thenvoi-sdk", now "band-sdk")
# + agent frameworks. The SDK repo pins a private `.claude` git submodule that
# pip can't clone, so install it from a no-submodule local clone instead — see
# docs/BAND_SETUP.md. langchain-anthropic powers the cross-model panel.
band = [
    "band-sdk[langgraph,anthropic] @ git+https://github.com/thenvoi/thenvoi-sdk-python.git",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-anthropic>=0.3.0",
]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
