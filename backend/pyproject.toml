[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "juro"
version = "0.2.0"
authors = [
  { name="Priyanshu" },
]
description = "Juro — an adversarial AI tribunal for denied health-insurance claims, built on Band (thenvoi)."
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Local debate generator (python -m juro.generate). Its Anthropic calls are blocked by
    # juro.providers (no paid services); kept so the module still imports.
    "anthropic>=0.40.0",

    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Band submission path — the Band SDK (formerly "thenvoi-sdk", now "band-sdk")
# + agent frameworks. The SDK repo pins a private `.claude` git submodule that
# pip can't clone, so install it from a no-submodule local clone instead — see
# docs/BAND_SETUP.md. The agents run on Groq's free tier via langchain-groq.
band = [
    "band-sdk[langgraph] @ git+https://github.com/thenvoi/thenvoi-sdk-python.git",
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-groq>=1.1.0",
]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0", "langchain-groq>=1.1.0", "langgraph>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
# Generated from data/cases.json by scripts/sync_cases.py.
juro = ["cases_data.json"]
